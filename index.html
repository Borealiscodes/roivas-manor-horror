<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROIVAS MANOR — Over-the-Shoulder Horror (Q16.16)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #030205; color: #d8cce8; font-family: monospace; display: flex; flex-direction: column; align-items: center; padding: 8px; gap: 6px; }
    h1 { font-size: 0.94rem; letter-spacing: 0.1em; color: #c48cff; text-align: center; }
    #narration-bar { width: 100%; max-width: 720px; background: #0c0712; border: 1px solid #3c1e4a; padding: 7px 10px; font-size: 0.76rem; color: #f0d9ff; line-height: 1.4; }
    #viewport-wrap { position: relative; width: 100%; max-width: 720px; aspect-ratio: 480 / 272; border: 2px solid #3c1e4a; box-shadow: 0 0 30px rgba(140, 40, 220, 0.25); overflow: hidden; }
    canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; touch-action: none; cursor: crosshair; }
    #sanity-banner { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); background: rgba(160, 0, 20, 0.92); color: #fff; padding: 4px 10px; font-size: 0.75rem; display: none; pointer-events: none; }
    .controls, .sigil-bar { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; max-width: 720px; }
    button, select { background: #140b1c; color: #eee2ff; border: 1px solid #4e2a63; padding: 5px 8px; font-family: monospace; font-size: 0.75rem; cursor: pointer; }
    button.spell-btn { border-color: #9d4edd; color: #e0aaff; }
    #hud { width: 100%; max-width: 720px; background: #09060e; border: 1px solid #261636; padding: 7px 10px; font-size: 0.75rem; line-height: 1.45; white-space: pre-line; }
  </style>
</head>
<body>
  <h1>🕯️ ROIVAS MANOR: OVER-THE-SHOULDER (Q16.16)</h1>
  <div id="narration-bar">Booting Roivas Archive...</div>
  <div id="viewport-wrap">
    <canvas id="screen" width="480" height="272"></canvas>
    <div id="sanity-banner"></div>
  </div>
  <div class="controls">
    <button id="fwd-btn">▲ Step Forward</button>
    <button id="back-btn">▼ Step Back</button>
    <button id="act-btn">🖐️ Inspect / Door</button>
    <button id="commit-btn" class="spell-btn">✦ Lock Drawn Rune</button>
    <button id="cast-btn" class="spell-btn">🔥 Cast Spell</button>
    <button id="clear-btn">↺ Clear</button>
    <button id="audio-btn">🔊 Gothic Synth</button>
  </div>
  <div class="sigil-bar">
    <select id="quick-rune" aria-label="Quick-Inscribe Tome Rune">
      <option value="ULYAOTH">[Align] Ulyaoth (Blue ◇)</option>
      <option value="CHATTURGHA">[Align] Chattur'gha (Red ∨)</option>
      <option value="XELLOTATH">[Align] Xel'lotath (Green ||)</option>
      <option value="MANTOROK">[Align] Mantorok (Purple ✕)</option>
      <option value="BANKOROK">[Verb] Bankorok (Ward / Unseal)</option>
      <option value="ANTORBOK">[Verb] Antorbok (Attack / Shatter)</option>
      <option value="TIER">[Verb] Tier (Summon)</option>
      <option value="NAROKATH">[Verb] Narokath (Absorb)</option>
      <option value="REDGORMOR">[Noun] Redgormor (Area)</option>
      <option value="ARETAK">[Noun] Aretak (Creature)</option>
      <option value="MAGORMOR">[Noun] Magormor (Item)</option>
      <option value="PARGON">[Boost] Pargon (1.5x Power ○)</option>
    </select>
    <button id="add-sigil-btn" class="spell-btn">➕ Add Tome Rune</button>
  </div>
  <div id="hud">Initializing...</div>
  <script type="module">
    import { Q16_ONE, q16Clamp } from './src/core/q16.js';
    import { DollarPQ16Recognizer } from './src/physics/dollar_p_q16.js';
    import { ManorWorld } from './src/world/manor_sheaf_world.js';
    import { HorrorFramebuffer, FB_WIDTH, FB_HEIGHT } from './src/render/horror_renderer.js';
    import { HorrorAudioEngine } from './src/audio/horror_synth.js';

    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    const imgData = ctx.createImageData(FB_WIDTH, FB_HEIGHT);
    const imgU32 = new Uint32Array(imgData.data.buffer);
    const narrBar = document.getElementById('narration-bar');
    const sanityBanner = document.getElementById('sanity-banner');
    const hud = document.getElementById('hud');

    const world = new ManorWorld();
    const recognizer = new DollarPQ16Recognizer();
    const fb = new HorrorFramebuffer();
    const audio = new HorrorAudioEngine(22050);

    let qAlign = null, qVerb = null, qNoun = null, qPargons = 0;
    let tick = 0;
    narrBar.textContent = world.statusLog;

    let audioCtx = null;
    function unlockAudio() {
      if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
      const Ctor = window.AudioContext || window.webkitAudioContext;
      audioCtx = new Ctor({ sampleRate: 22050 });
      const node = audioCtx.createScriptProcessor(1024, 0, 1);
      node.onaudioprocess = (e) => {
        const out = e.outputBuffer.getChannelData(0);
        const room = world.rooms[world.currentRoom];
        const near = Boolean(room.horror && room.horror.alive && Math.abs(room.horror.depth - world.depth) < 35);
        const pcm = audio.renderBlock(out.length, world.sanityQ16, near);
        for (let i = 0; i < out.length; i++) out[i] = pcm[i] / 32768;
      };
      node.connect(audioCtx.destination);
      document.getElementById('audio-btn').textContent = '🔊 Synth Active';
    }
    document.getElementById('audio-btn').addEventListener('click', unlockAudio);

    function queueRune(r) {
      if (r === 'CHATTURGHA' || r === 'ULYAOTH' || r === 'XELLOTATH' || r === 'MANTOROK') qAlign = r;
      else if (r === 'ANTORBOK' || r === 'BANKOROK' || r === 'TIER' || r === 'NAROKATH') qVerb = r;
      else if (r === 'REDGORMOR' || r === 'ARETAK' || r === 'MAGORMOR') qNoun = r;
      else if (r === 'PARGON') qPargons++;
      audio.triggerSting(246);
    }

    document.getElementById('fwd-btn').addEventListener('click', () => { unlockAudio(); world.stepForward(16); narrBar.textContent = world.statusLog; });
    document.getElementById('back-btn').addEventListener('click', () => { unlockAudio(); world.stepForward(-16); narrBar.textContent = world.statusLog; });
    document.getElementById('act-btn').addEventListener('click', () => {
      unlockAudio();
      const res = world.interact();
      narrBar.textContent = world.statusLog;
      if (res.event === 'UNLOCK' || res.event === 'INSPECT') audio.triggerSting(293);
    });

    document.getElementById('add-sigil-btn').addEventListener('click', () => {
      unlockAudio();
      const r = document.getElementById('quick-rune').value;
      queueRune(r);
      narrBar.textContent = 'Added ' + r + ' to ritual circle.';
    });

    let drawing = false;
    function getPt(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: q16Clamp((((e.clientX - rect.left) / rect.width) * FB_WIDTH) | 0, 0, FB_WIDTH - 1),
        y: q16Clamp((((e.clientY - rect.top) / rect.height) * FB_HEIGHT) | 0, 0, FB_HEIGHT - 1)
      };
    }
    canvas.addEventListener('pointerdown', (e) => { unlockAudio(); drawing = true; const p = getPt(e); recognizer.beginStroke(p.x, p.y); });
    canvas.addEventListener('pointermove', (e) => { if (!drawing) return; const p = getPt(e); recognizer.addPoint(p.x, p.y); });
    window.addEventListener('pointerup', () => { if (drawing) { drawing = false; recognizer.endStroke(); } });

    document.getElementById('commit-btn').addEventListener('click', () => {
      const match = recognizer.commitGlyph();
      if (!match || !match.runeId) return;
      queueRune(match.runeId);
      narrBar.textContent = 'Recognized drawn rune: ' + match.runeId + ' (' + (((match.accuracyQ16 * 100) >> 16)) + '%)';
    });

    document.getElementById('cast-btn').addEventListener('click', () => {
      unlockAudio();
      if (!qAlign || !qVerb || !qNoun) {
        narrBar.textContent = 'Complete 3-part spell first: [Alignment + Verb + Noun] (e.g., ULYAOTH + BANKOROK + REDGORMOR).';
        return;
      }
      const res = world.castFullSpell(qAlign, qVerb, qNoun, qPargons);
      narrBar.textContent = world.statusLog;
      audio.triggerSting(res.outcome === 'BACKFIRE' ? 110 : 330);
      qAlign = null; qVerb = null; qNoun = null; qPargons = 0;
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      recognizer.clear();
      qAlign = null; qVerb = null; qNoun = null; qPargons = 0;
      narrBar.textContent = 'Cleared active rune circuit.';
    });

    function frame() {
      tick++;
      const state = world.step(tick);
      fb.renderScene(world, recognizer.strokes, recognizer.current, tick);

      if (state.sanityQ16 < 26000 && ((tick >> 5) & 1) === 0) {
        sanityBanner.style.display = 'block';
        sanityBanner.textContent = 'SANITY CRITICAL — REALITY DISTORTING';
        canvas.style.transform = 'rotate(' + (((tick >> 3) % 5) - 2) + 'deg)';
      } else {
        sanityBanner.style.display = 'none';
        canvas.style.transform = 'none';
      }

      imgU32.set(fb.resolveRGBA32());
      ctx.putImageData(imgData, 0, 0);

      const room = world.rooms[world.currentRoom];
      const inv = Array.from(world.inventory).join(', ') || 'None';
      hud.textContent =
        'Location: ' + room.name + ' (Depth ' + world.depth + '/100) | Sanity: ' + ((state.sanityQ16 * 100) >> 16) + '%\n' +
        'Circuit: [' + (qAlign || 'Align?') + ' + ' + (qVerb || 'Verb?') + ' + ' + (qNoun || 'Noun?') + (qPargons ? ' + ' + qPargons + 'x PARGON' : '') + '] | Inventory: ' + inv;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
